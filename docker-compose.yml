name: manage-library-books

services:
    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-library_books}
            POSTGRES_USER: ${DB_USERNAME:-library}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-library} -d ${DB_DATABASE:-library_books}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped
        networks: [backend]

    api:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        environment:
            APP_NAME: ${APP_NAME:-Library Books}
            APP_ENV: ${APP_ENV:-local}
            APP_KEY: ${APP_KEY:-}
            APP_DEBUG: ${APP_DEBUG:-true}
            APP_URL: ${APP_URL:-http://localhost:8000}
            APP_LOCALE: es
            APP_FALLBACK_LOCALE: en
            LOG_CHANNEL: stderr
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-library_books}
            DB_USERNAME: ${DB_USERNAME:-library}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            SESSION_DRIVER: array
            CACHE_STORE: file
            QUEUE_CONNECTION: sync
            RUN_MIGRATIONS: "true"
            RUN_SEEDERS: "true"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        restart: unless-stopped
        networks: [backend]

    web:
        image: nginx:alpine
        ports:
            - "${API_PORT:-8000}:80"
        volumes:
            - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        depends_on:
            api:
                condition: service_started
        restart: unless-stopped
        networks: [backend]

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "${FRONTEND_PORT:-3000}:80"
        depends_on:
            - api
        restart: unless-stopped
        networks: [backend]

volumes:
    pgdata:

networks:
    backend:
